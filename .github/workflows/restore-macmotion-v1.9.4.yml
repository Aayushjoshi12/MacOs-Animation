name: Restore MacMotion v1.9.4

on:
  push:
    branches: [main]
    paths:
      - macmotion_optimized_v1.9.4.wh.cpp.xz

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore optimized MacMotion source
        shell: bash
        run: |
          xz -dc macmotion_optimized_v1.9.4.wh.cpp.xz > mod.wh.cpp
          grep -q '^// @version         1.9.4$' mod.wh.cpp

      - name: Commit restored source
        shell: bash
        run: |
          rm -f macmotion_optimized_v1.9.4.wh.cpp.xz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mod.wh.cpp macmotion_optimized_v1.9.4.wh.cpp.xz
          if ! git diff --cached --quiet; then
            git commit -m 'Optimize MacMotion to v1.9.4'
            git push
          fi
