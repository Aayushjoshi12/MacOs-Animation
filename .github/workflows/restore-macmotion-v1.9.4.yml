name: Restore MacMotion v1.9.4

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-macmotion-v1.9.4.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore optimized MacMotion source
        shell: bash
        run: |
          cat macmotion_payload/v1.9.4.part1 \
              macmotion_payload/v1.9.4.part2a \
              macmotion_payload/v1.9.4.part2b \
              macmotion_payload/v1.9.4.part3 \
              macmotion_payload/v1.9.4.part4 \
              macmotion_payload/v1.9.4.part5 \
            | base64 -d > macmotion_v1.9.4.xz
          xz -t macmotion_v1.9.4.xz
          xz -dc macmotion_v1.9.4.xz > mod.wh.cpp
          grep -q '^// @version         1.9.4$' mod.wh.cpp

      - name: Commit restored source
        shell: bash
        run: |
          rm -f macmotion_v1.9.4.xz
          rm -rf macmotion_payload
          rm -f macmotion_optimized_v1.9.4.wh.cpp.xz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Optimize MacMotion to v1.9.4'
            git push
          fi
